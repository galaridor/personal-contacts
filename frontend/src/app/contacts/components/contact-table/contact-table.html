<p-table
  [value]="contacts()"
  [loading]="loading()"
  [rowTrackBy]="trackById"
  dataKey="id"
  styleClass="p-datatable-sm"
  responsiveLayout="scroll"
  [paginator]="true"
  [rows]="rows()"
  [first]="first()"
  [totalRecords]="totalRecords()"
  [rowsPerPageOptions]="pageSizeOptions"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="{first} to {last} of {totalRecords} contacts"
  [lazy]="true"
  [lazyLoadOnInit]="false"
  (onLazyLoad)="onLazyLoad($event)"
>
  <ng-template #header>
    <tr>
      <th scope="col">Name</th>
      <th scope="col">Date of birth</th>
      <th scope="col">Phone</th>
      <th scope="col">IBAN</th>
      <th scope="col">City</th>
      <th scope="col" class="w-[1%] text-right">
        <span class="sr-only">Actions</span>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-row>
    @let contact = asContact(row);
    <tr data-testid="contact-row">
      <td>
        <span class="font-semibold">{{ contact.firstName }} {{ contact.surname }}</span>
      </td>
      <td>{{ contact.dateOfBirth | date: 'dd MMM yyyy' }}</td>
      <td>{{ contact.phoneNumber }}</td>
      <td class="font-mono text-[0.85rem] whitespace-nowrap">{{ contact.iban | iban }}</td>
      <td>{{ contact.address.city }}</td>
      <td class="w-[1%] text-right">
        <div class="flex justify-end gap-[0.15rem]">
          <p-button
            icon="pi pi-eye"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="'View ' + contact.firstName + ' ' + contact.surname"
            pTooltip="View details"
            data-testid="view-contact"
            (onClick)="view.emit(contact)"
          />
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="'Edit ' + contact.firstName + ' ' + contact.surname"
            pTooltip="Edit"
            data-testid="edit-contact-row"
            (onClick)="edit.emit(contact)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="'Delete ' + contact.firstName + ' ' + contact.surname"
            pTooltip="Delete"
            data-testid="delete-contact"
            (onClick)="remove.emit(contact)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
